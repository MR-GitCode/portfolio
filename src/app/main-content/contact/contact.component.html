<section class="section-bg" id="contact-section" *ngIf="contactContent$ | async as contactContent">
    <div class="contact-content">
        <div class="headline-container">
            <div class="headline">
                <p>{{ contactContent.subtitle[languageService.lang] }}</p>
                <h1>{{ contactContent.title[languageService.lang] }}</h1>
            </div>
            <p>{{ contactContent.text[languageService.lang] }}</p>
            <img src="/assets/img/00_hand-drawn-lines/05_Contact/Color_option_1.png">
        </div>
        <div class="form-container">
            <div class="sticker-container">
               <div class="contact-sticker">
                    <div class="sticker-content">
                        <img src="/assets/img/00_hand-drawn-lines/00_Header/Logo.png" alt="Logo">
                        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                            <path id="SunCatcherStudio" fill="none" stroke="none" d="M 32.550491,148.48008 A -108.15144,-108.15144 0 0 1 140.70194,40.328644 -108.15144,-108.15144 0 0 1 248.85338,148.48008 -108.15144,-108.15144 0 0 1 140.70194,256.63153 -108.15144,-108.15144 0 0 1 32.550491,148.48008 Z" />  
                            <text font-size="16" fill="#000000" letter-spacing="1.6" font-family="Bricolage" font-weight="bold">
                                <textPath xlink:href="#SunCatcherStudio" side="left" startOffset="5">Michael Ring - Frontend Developer - Michael Ring - Frontend Developer - </textPath>
                            </text>
                        </svg>
                    </div>
                    <img src="/assets/img/03_stickers/00_Round/01_Color_option_1_Orange.png">
                </div> 
            </div>
            <app-form></app-form>
        </div>
    </div>
</section>
