@if (projectsContent(); as projectsContent) {
    <section class="section-bg" id="projectsoverview">
        <div class="projects-overview-container">
            <div class="headline-container">
                <div class="headline">
                    <p>{{ projectsContent.subtitle[languageService.lang] }}</p>
                    <div id="headline-drawline">
                        <h1>{{ projectsContent.title[languageService.lang] }}</h1>
                        <div id="drawline" appAnimateOnScroll [delay]="300"></div>
                    </div>
                </div>
                <p data-aos="zoom-out-up">{{ projectsContent.text[languageService.lang] }}</p>
            </div>
            @for(project of projects(); track project.id ) {
                <app-project-view data-aos="zoom-out-up" [project]="project"></app-project-view>     
            }
        </div>
    </section>
}
