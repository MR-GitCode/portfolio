<section class="project-container padding-bottom">
    <div class="projects-link-container">
        <img class="img-project" [src]="project.imgURL">
        <div class="bg-linear-gradient">
            <app-contact-button class="contact-btn" textBtn="Project details"></app-contact-button>  
        </div>
    </div>
    <div>
        <h3>{{project.title}}</h3>
        <p>{{project.description.de || project.description.en}}</p>  
    </div>
</section>
