<div class="contact-sticker">
  <div class="sticker-content">
    <img class="center-img"
      [src]="centerImgSrc"
      [style.width.px]="imgWidth"
      [style.height.px]="imgHeight">

    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path [attr.id]="topId" [attr.d]="topArcD" fill="none"></path>

      <path
        [attr.id]="bottomId"
        [attr.d]="config.bottomUpsideDown ? bottomArcFlippedD : bottomArcD"
        fill="none">
      </path>

      <text
        [attr.font-size]="config.textFontSize"
        [attr.fill]="config.textFill"
        [attr.letter-spacing]="config.textLetterSpacing"
        font-family="Bricolage"
        font-weight="bold">

        <!-- Text top -->
        <textPath
          [attr.href]="'#' + topId"
          [attr.startOffset]="topOffset"
          text-anchor="middle">
          {{ topText }}
        </textPath>

        <!-- Text bottom -->
        <textPath
          [attr.href]="'#' + bottomId"
          [attr.startOffset]="bottomOffset"
          text-anchor="middle">
          {{ bottomText }}
        </textPath>

      </text>
    </svg>
  </div>

  <img [src]="imgSrc">
</div>
