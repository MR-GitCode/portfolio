@if (hasUrl) {
    <button class="contact-bt hover-target" [disabled]="disabled">
        <div class="border" [ngClass]="class">
           <a href="{{urlBtn}}"><p>{{textBtn}}</p></a> 
        </div>
    </button> 
} @else {
    <button class="contact-bt hover-target" [ngClass]="class" [disabled]="disabled">
        <p>{{textBtn}}</p>
    </button> 
}
